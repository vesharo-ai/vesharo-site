<svg width="400" height="400" viewBox="0 0 400 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="avatarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1B4B" />
      <stop offset="50%" stop-color="#181824" />
      <stop offset="100%" stop-color="#0F0F15" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A78BFA" />
      <stop offset="100%" stop-color="#7C5CFF" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#7C5CFF" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#7C5CFF" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" rx="32" fill="url(#avatarGrad)" />
  <rect width="400" height="400" rx="32" fill="url(#glow)" />
  <rect x="1" y="1" width="398" height="398" rx="31" stroke="#7C5CFF" stroke-opacity="0.4" stroke-width="2" />

  <!-- Subtle architectural grid lines -->
  <circle cx="200" cy="180" r="120" stroke="#7C5CFF" stroke-opacity="0.15" stroke-dasharray="4 6" />
  <circle cx="200" cy="180" r="80" stroke="#A78BFA" stroke-opacity="0.2" />

  <!-- Monogram Initials -->
  <text x="200" y="205" font-family="Outfit, -apple-system, sans-serif" font-size="76" font-weight="700" fill="url(#accentGrad)" text-anchor="middle" letter-spacing="-2">HC</text>

  <!-- Title Pill -->
  <g transform="translate(110, 310)">
    <rect width="180" height="36" rx="18" fill="#171720" stroke="#7C5CFF" stroke-opacity="0.3" />
    <text x="90" y="23" font-family="Outfit, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#E2E8F0" text-anchor="middle" letter-spacing="1">HITESH CHAUHAN</text>
  </g>
</svg>
